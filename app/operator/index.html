</head>

<header class="topbar">
  <button id="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
  <span class="op-wordmark">EarWitness</span>
  <span class="op-tag">Operator · internal</span>
  <nav class="sidebar" id="sidebar" aria-label="Primary">

  </main>
</div>
<div id="live" class="visually-hidden" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title">
  <h2 id="modal-title"></h2>
  <div id="modal-body"></div>
  <form method="dialog" class="modal-actions">
    <button id="modal-ok" type="submit" value="ok">Close</button>
  </form>
</dialog>
<script src="/app/operator/app.js"></script>
<script src="/app/operator/views.js"></script>
